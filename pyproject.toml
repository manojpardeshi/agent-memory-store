[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "llm-memory-store"
version = "0.3.0"
description = "A personal, local-first memory store for LLM applications and agents"
readme = "README.md"
authors = [
  { name = "Manoj Pardeshi" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "memory", "mcp", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastembed>=0.8,<1",
  "mcp>=1.30,<2",
  "sqlite-vec>=0.1.9,<0.2",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
llm-memory = "llm_memory_store.cli:main"
llm-memory-mcp = "llm_memory_store.mcp_server:main"

[project.urls]
Homepage = "https://github.com/manojpardeshi/agent-memory-store"
Repository = "https://github.com/manojpardeshi/agent-memory-store"
Issues = "https://github.com/manojpardeshi/agent-memory-store/issues"
Changelog = "https://github.com/manojpardeshi/agent-memory-store/blob/main/CHANGELOG.md"
Documentation = "https://github.com/manojpardeshi/agent-memory-store/blob/main/README.md"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
  "/demo/dashboard/node_modules",
  "/demo/dashboard/.next",
  "/demo/dashboard/.vinext",
  "/demo/dashboard/.wrangler",
  "/demo/dashboard/dist",
  "/demo/dashboard/out",
  "/demo/dashboard/outputs",
  "/demo/dashboard/work",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_memory_store"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/llm_memory_store",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# A frozen benchmark-runner template with placeholders filled in at build time; not importable.
extend-exclude = ["evaluation/memorybench/kaggle/runner_template.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
